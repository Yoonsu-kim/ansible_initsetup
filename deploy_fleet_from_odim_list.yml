- name: Build fleet inventory from ODIM IP list
  hosts: localhost
  gather_facts: false
  vars:
    selected_odim_sets: "{{ (fleet_set.split(',') | map('trim') | list) if fleet_set is defined else [] }}"
    common_ssh_args: >-
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
  tasks:
    - name: Validate selected ODIM sets
      ansible.builtin.assert:
        that:
          - selected_odim_sets | length > 0
          - selected_odim_sets | difference(odim_sets.keys() | list) | length == 0
        fail_msg: >-
          fleet_set must match odim_sets entries.
          Requested: {{ selected_odim_sets | join(', ') }}.
          Available: {{ odim_sets.keys() | list | join(', ') }}.
      when: fleet_set is defined

    - name: Validate ODIM set entries
      ansible.builtin.assert:
        that:
          - item.value is mapping
          - item.value.odim_ip is defined
          - item.value.config_set is defined
        fail_msg: >-
          odim_sets.{{ item.key }} must define odim_ip and config_set.
      loop: "{{ odim_sets | dict2items }}"
      when: fleet_set is not defined or item.key in selected_odim_sets

    - name: Add ODIM hosts
      ansible.builtin.add_host:
        name: "{{ item.key }}_odim"
        groups:
          - initial_setup_targets
          - role_odim
        ansible_host: "{{ item.value.odim_ip }}"
        ansible_user: odin
        ansible_password: "{{ ssh_pass | mandatory }}"
        ansible_ssh_common_args: "{{ common_ssh_args }}"
        initial_setup_config_set: "{{ item.value.config_set }}"
        initial_setup_config_role: role_odim
      loop: "{{ odim_sets | dict2items }}"
      when: fleet_set is not defined or item.key in selected_odim_sets

    - name: Add ODIL hosts through matching ODIM
      ansible.builtin.add_host:
        name: "{{ item.key }}_odil"
        groups:
          - initial_setup_targets
          - role_odil
        ansible_host: "{{ odil_inner_ip }}"
        ansible_user: odin
        ansible_password: "{{ ssh_pass | mandatory }}"
        ansible_ssh_common_args: >-
          {{ common_ssh_args }}
          -o ProxyCommand="sshpass -p {{ ssh_pass | mandatory }} ssh -W %h:%p
          {{ common_ssh_args }}
          odin@{{ item.value.odim_ip }}"
        initial_setup_config_set: "{{ item.value.config_set }}"
        initial_setup_config_role: role_odil
      loop: "{{ odim_sets | dict2items }}"
      when: fleet_set is not defined or item.key in selected_odim_sets

    - name: Add ODIC hosts through matching ODIM
      ansible.builtin.add_host:
        name: "{{ item.key }}_odic"
        groups:
          - initial_setup_targets
          - role_odic
        ansible_host: "{{ odic_inner_ip }}"
        ansible_user: odin
        ansible_password: "{{ ssh_pass | mandatory }}"
        ansible_ssh_common_args: >-
          {{ common_ssh_args }}
          -o ProxyCommand="sshpass -p {{ ssh_pass | mandatory }} ssh -W %h:%p
          {{ common_ssh_args }}
          odin@{{ item.value.odim_ip }}"
        initial_setup_config_set: "{{ item.value.config_set }}"
        initial_setup_config_role: role_odic
      loop: "{{ odim_sets | dict2items }}"
      when: fleet_set is not defined or item.key in selected_odim_sets

- name: Deploy generated inventory targets
  ansible.builtin.import_playbook: deploy_initial_setup.yml
