[initial_setup_targets:children]
role_odim
role_odil
role_odic

[role_odim]
car01_odim ansible_host=10.8.0.11 ansible_user=odin ansible_password="{{ ssh_pass | mandatory }}"
car02_odim ansible_host=10.8.0.12 ansible_user=odin ansible_password="{{ ssh_pass | mandatory }}"

[role_odim:vars]
initial_setup_config_role=role_odim

[role_odil]
car01_odil ansible_host=192.168.31.7 ansible_user=odin ansible_password="{{ ssh_pass | mandatory }}" ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="sshpass -p {{ ssh_pass | mandatory }} ssh -W %h:%p -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null odin@10.8.0.11"'
car02_odil ansible_host=192.168.31.7 ansible_user=odin ansible_password="{{ ssh_pass | mandatory }}" ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="sshpass -p {{ ssh_pass | mandatory }} ssh -W %h:%p -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null odin@10.8.0.12"'

[role_odil:vars]
initial_setup_config_role=role_odil

[role_odic]
car01_odic ansible_host=192.168.31.8 ansible_user=odin ansible_password="{{ ssh_pass | mandatory }}" ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="sshpass -p {{ ssh_pass | mandatory }} ssh -W %h:%p -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null odin@10.8.0.11"'
car02_odic ansible_host=192.168.31.8 ansible_user=odin ansible_password="{{ ssh_pass | mandatory }}" ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="sshpass -p {{ ssh_pass | mandatory }} ssh -W %h:%p -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null odin@10.8.0.12"'

[role_odic:vars]
initial_setup_config_role=role_odic
